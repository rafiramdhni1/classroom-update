server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # PENTING: tanpa baris di bawah ini, nginx me-resolve "app" SATU KALI saat
    # start lalu menyimpan IP-nya selamanya. Kalau container app di-recreate
    # (mis. `docker compose up -d` setelah compose berubah), IP-nya berubah
    # tapi nginx masih memegang IP lama -> 502 Bad Gateway.
    # Resolver Docker embedded DNS + variable di proxy_pass = re-resolve periodik.
    # Proxy_pass wajib pakai variabel ($upstream) supaya resolver berlaku.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app http://app:5000;

    # Frontend + API (Express di service "app")
    location / {
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api {
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Aset statis: cache 30 hari
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass $upstream_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}